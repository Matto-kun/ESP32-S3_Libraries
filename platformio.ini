; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = espidf

board_build.flash_size = 16MB
board_build.extra_flags = -DBOARD_HAS_PSRAM

monitor_speed = 115200

; Poll QMC5883P on SDA 8 / SCL 9 (examples/qmc5883p_example.cpp).
;   pio run -e esp32-s3-qmc5883p-example -t upload --upload-port /dev/ttyACM0
[env:esp32-s3-qmc5883p-example]
extends = env:esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.cmake_extra_args =
    -DQMC5883P_EXAMPLE=1
build_flags =
    -DQMC5883P_EXAMPLE=1

; Poll HMC5883L on SDA 9 / SCL 11 (examples/hmc5883l_example.cpp).
;   pio run -e esp32-s3-hmc5883l-example -t upload --upload-port /dev/ttyACM0
[env:esp32-s3-hmc5883l-example]
extends = env:esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.cmake_extra_args =
    -DHMC5883L_EXAMPLE=1
build_flags =
    -DHMC5883L_EXAMPLE=1

; Bluedroid GATT peripheral bring-up (replaces firmware on the board).
;   pio run -e esp32-s3-bluedroid-peri -t upload
;   pio device monitor -e esp32-s3-bluedroid-peri
[env:esp32-s3-bluedroid-peri]
extends = env:esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.sdkconfig_defaults = sdkconfig.defaults.bluedroid_peri
board_build.cmake_extra_args =
    -DBLUEDROID_PERI_BRINGUP=1
build_flags =
    -DBLUEDROID_PERI_BRINGUP=1

; Espressif HCI VHCI ADV example (name "ESP-BLE-HELLO", controller-only).
;   pio run -e esp32-s3-hci-vhci-adv -t upload
[env:esp32-s3-hci-vhci-adv]
extends = env:esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.sdkconfig_defaults = sdkconfig.defaults.hci_vhci
board_build.cmake_extra_args =
    -DHCI_VHCI_ADV_BRINGUP=1
build_flags =
    -DHCI_VHCI_ADV_BRINGUP=1

; Official Espressif gatt_server example (name ESP_GATTS_DEMO).
;   pio run -e esp32-s3-idf-gatt-server -t upload
[env:esp32-s3-idf-gatt-server]
extends = env:esp32-s3-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_build.sdkconfig_defaults = sdkconfig.defaults.idf_gatt_server
board_build.cmake_extra_args =
    -DIDF_GATT_SERVER_BRINGUP=1
build_flags =
    -DIDF_GATT_SERVER_BRINGUP=1

; Official Espressif ble_hid_device_demo (ADV name "HID").
;   pio run -e esp32-s3-idf-hid -t upload
[env:esp32-s3-idf-hid]
extends = env:esp32-s3-devkitc-1
